services:
  - type: web
    name: roadwatch-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: streamlit run backend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_PASSWORD
        value: admin123
      - key: ROADWATCH_MOCK_AI
        value: "1"
